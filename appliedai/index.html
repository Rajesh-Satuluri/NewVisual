<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Applied AI — Study Lab · EDA</title>
  <meta name="description" content="Interactive Applied AI / Machine Learning study lab — Exploratory Data Analysis, distributions, central tendency & spread, with animated visuals built from the Applied ML course notes." />
  <meta name="theme-color" content="#8B5CF6" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%238B5CF6'/%3E%3Ctext x='50' y='70' font-size='56' text-anchor='middle' fill='white'%3E%F0%9F%A7%A0%3C/text%3E%3C/svg%3E" />
  <meta property="og:title" content="Applied AI — Study Lab" />
  <meta property="og:description" content="Animated, interactive study lab for Applied Machine Learning — starting with Exploratory Data Analysis." />
  <script>try{var t=localStorage.getItem('aai-theme')||'dark';document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app" id="app">
    <!-- SIDEBAR -->
    <aside class="side">
      <div class="brand">
        <div class="logo">🧠</div>
        <div>
          <h1>Applied AI · Study Lab</h1>
          <div class="ed">Machine Learning Notes</div>
        </div>
      </div>

      <div class="progress-wrap">
        <div class="progress-row"><span>Progress</span><span id="prog-txt">0 / 0</span></div>
        <div class="progress-track"><div class="progress-fill" id="prog-fill"></div></div>
      </div>

      <div class="search"><input id="search" type="search" placeholder="Filter lessons…" aria-label="Filter lessons" /></div>

      <nav class="nav" id="nav"></nav>

      <div class="side-foot">
        <a href="../" title="Back to all tools">← All tools</a>
        <span class="sp"></span>
        <button id="theme" title="Toggle theme" aria-label="Toggle light / dark">🌙</button>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main" id="main">
      <div class="topbar">
        <button class="iconbtn menu-btn" id="menu" aria-label="Open navigation">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="crumb" id="crumb">Exploratory Data Analysis</div>
        <span class="sp"></span>
        <button class="iconbtn" id="prev" title="Previous lesson (←)" aria-label="Previous lesson">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button class="iconbtn" id="next" title="Next lesson (→)" aria-label="Next lesson">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
      <div class="content" id="content"></div>
    </main>

    <div class="scrim" id="scrim"></div>
  </div>

  <script src="data.js"></script>
  <script src="viz.js"></script>
  <script src="app.js"></script>
</body>
</html>
