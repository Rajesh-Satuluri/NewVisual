<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SQL Study Lab — T-SQL Interview Prep</title>
  <meta name="description" content="An interactive study tool for SQL Server (T-SQL) interview questions: paraphrased prompts, sample data, expected output, runnable SSMS setup scripts, multiple T-SQL approaches, and progress tracking." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2321a366'/%3E%3Ctext x='50' y='68' font-size='40' font-family='Arial' font-weight='bold' text-anchor='middle' fill='%23071120'%3ESQL%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/prism-tomorrow.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <!-- ============ TOP BAR ============ -->
  <header class="topbar">
    <button id="menuBtn" class="icon-btn menu-only" aria-label="Toggle sidebar">☰</button>
    <a class="brand" href="#">
      <span class="brand-mark">SQL</span>
      <span class="brand-text"><b>SQL</b> · T-SQL Study Lab</span>
    </a>
    <div class="topbar-right">
      <button id="gridBtn" class="ghost-btn" title="All-problems revision grid">▦ Revision grid</button>
      <button id="exportBtn" class="ghost-btn" title="Download progress as JSON">↓ Export</button>
      <button id="importBtn" class="ghost-btn" title="Import progress JSON">↑ Import</button>
      <input id="importFile" type="file" accept="application/json" hidden />
      <button id="resetBtn" class="ghost-btn danger" title="Reset all progress">⟳ Reset</button>
      <button id="themeBtn" class="ghost-btn">☀ Light</button>
      <a class="ghost-btn" href="../index.html" title="Back to NewVisual labs">⌂ Labs</a>
    </div>
  </header>

  <div class="shell">
    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar">
      <div class="progress-box">
        <div class="progress-head">
          <span id="progressText">0 solved</span>
          <span id="progressSub" class="muted">0 learning</span>
        </div>
        <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
        <div class="progress-foot muted">of <span id="totalCount">0</span> SQL problems</div>
      </div>

      <div class="search-box">
        <input id="search" type="text" placeholder="Search title, pattern, concept, technique…  ( / )" autocomplete="off" />
      </div>

      <div class="filters">
        <select id="filterDifficulty" title="Filter by difficulty">
          <option value="all">All difficulty</option>
          <option value="Easy">Easy</option>
          <option value="Medium">Medium</option>
          <option value="Hard">Hard</option>
        </select>
        <select id="filterStatus" title="Filter by status">
          <option value="all">Any status</option>
          <option value="not-started">Not started</option>
          <option value="learning">Learning</option>
          <option value="solved">Solved</option>
          <option value="review">★ Review queue</option>
        </select>
        <select id="filterPattern" title="Filter by pattern">
          <option value="all">All patterns</option>
        </select>
        <select id="filterPlatform" title="Filter by platform">
          <option value="all">All platforms</option>
        </select>
        <button id="clearFilters" class="clear-btn" title="Clear search & filters">✕</button>
      </div>

      <nav id="nav" class="nav"></nav>
    </aside>

    <!-- ============ MAIN ============ -->
    <main id="main" class="main"></main>
  </div>

  <!-- ============ REVISION GRID MODAL ============ -->
  <div id="gridModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h2>All Problems — Revision Grid</h2>
        <button id="gridClose" class="icon-btn">✕</button>
      </div>
      <div id="gridBody" class="modal-body"></div>
    </div>
  </div>

  <!-- ============ SCRIPTS ============ -->
  <script src="js/vendor/prism.js"></script>
  <script src="js/vendor/prism-sql.js"></script>
  <script src="js/vendor/fuse.js"></script>

  <script src="js/core.js"></script>
  <script src="js/modules/markdown.js"></script>
  <script src="js/modules/store.js"></script>

  <!-- data (canonical topic order) -->
  <script src="data/aggregation.js"></script>
  <script src="data/filtering_subqueries.js"></script>
  <script src="data/ranking.js"></script>
  <script src="data/joins.js"></script>
  <script src="data/window_functions.js"></script>
  <script src="data/cte_joins.js"></script>
  <script src="data/string_date.js"></script>
  <script src="data/recursive.js"></script>
  <script src="data/pivot.js"></script>
  <script src="data/gaps_islands.js"></script>
  <script src="data/set_ops.js"></script>
  <script src="data/dml_ddl.js"></script>

  <script src="js/app.js"></script>
</body>
</html>
