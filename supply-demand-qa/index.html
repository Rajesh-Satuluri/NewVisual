<!DOCTYPE html>

  <link rel="stylesheet" href="css/style.css" />
  <style id="ipad-polish">
  /* iPad / touch polish — additive, non-destructive. Safe on all devices. */
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  html,body{overscroll-behavior:none}
  body{-webkit-tap-highlight-color:transparent}
  button,a,label,summary,select,[role="button"],[role="tab"],[role="link"],.tab,.btn{touch-action:manipulation}
  img,svg,canvas{-webkit-user-drag:none}
  @media (hover:none) and (pointer:coarse){
    button,summary,select,[role="button"],[role="tab"],.tab,.btn{
      -webkit-user-select:none;user-select:none;-webkit-touch-callout:none
    }
    input,select,textarea{font-size:max(16px,1em)!important}
  }
  @supports (padding:env(safe-area-inset-left)){
    @media (display-mode:standalone){
      body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
    }
  }
  </style>
</head>
<body>
  <header class="top">
    <a class="home" href="../index.html">← All labs</a>

    <div class="sub">Every question with a plain-English answer and a business-case example. 45 topic groups.</div>
  </header>

      </div>
      <div id="content"><div class="loading">Loading question bank…</div></div>
    </main>
  </div>

  <footer>
    Built as pure HTML + CSS + vanilla JS ·
    <a href="../index.html">NewVisual labs</a> ·
    <a href="https://github.com/rajesh-satuluri/newvisual">source on GitHub</a>
  </footer>

  <script src="data/questions.js"></script>

  <!-- Offline backup: one-click .zip download of this project (top-right) -->
