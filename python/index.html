<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PyRef — Python & PySpark Coding Companion</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
<div id="app">

  <!-- ── Sidebar ───────────────────────────────────────────────── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-logo">🐍</div>
      <div class="brand-text">
        <span class="brand-name">Py<span class="accent">Ref</span></span>
        <span class="brand-tagline">Python · NumPy · Pandas · PySpark</span>
      </div>
      <button class="sidebar-collapse-btn" id="sidebar-collapse" title="Collapse sidebar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
    </div>

    <div class="lang-tabs" id="lang-tabs">
      <div class="lang-tab active" data-lang="python">Python</div>
      <div class="lang-tab" data-lang="numpy">NumPy</div>
      <div class="lang-tab" data-lang="pandas">Pandas</div>
      <div class="lang-tab" data-lang="pyspark">PySpark</div>
    </div>

    <nav class="cat-nav" id="cat-nav"></nav>

    <div class="sidebar-footer">
      <button class="footer-btn" id="btn-favs" title="Saved functions">
        <span>★</span><span>Saved</span>
      </button>
      <button class="footer-btn" id="btn-recent" title="Recently viewed">
        <span>🕐</span><span>Recent</span>
      </button>
    </div>
  </aside>

  <!-- ── Main ──────────────────────────────────────────────────── -->
  <div class="main">
    <div class="topbar">
      <button class="action-btn" id="mobile-menu-btn" title="Open menu">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>

      <button class="search-trigger" id="search-trigger" tabindex="0" role="button" aria-label="Search functions (⌘K)">
        <svg class="search-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <span class="search-placeholder">Search functions, parameters, recipes…</span>
        <kbd class="search-kbd">⌘K</kbd>
      </button>

      <div class="topbar-actions">
        <button class="action-btn" id="btn-theme" title="Toggle theme">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="content" id="content">
      <div class="breadcrumb" id="breadcrumb">
        <span id="bc-lang">Python</span>
        <span class="bc-sep">›</span>
        <span id="bc-group"></span>
        <span class="bc-sep" id="bc-sep2" style="display:none">›</span>
        <span class="bc-active" id="bc-cat"></span>
      </div>

      <div class="cat-header" id="cat-header" style="display:none">
        <span class="cat-title" id="cat-title"></span>
        <span class="cat-meta" id="cat-meta"></span>
      </div>

      <div class="fn-list" id="fn-list"></div>
    </div>
  </div>
</div>

<!-- ── Search overlay ────────────────────────────────────────── -->
<div class="search-overlay hidden" id="search-overlay" role="dialog" aria-modal="true" aria-label="Search">
  <div class="search-modal">
    <div class="search-modal-input-wrap">
      <svg class="search-modal-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input class="search-modal-input" id="search-input" type="text" placeholder="Search functions, parameters, tags…" autocomplete="off" spellcheck="false">
      <kbd class="search-esc-kbd">Esc</kbd>
    </div>
    <div class="search-results" id="search-results"></div>
  </div>
</div>

<!-- Mobile backdrop -->
<div id="mobile-backdrop" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:250" onclick="closeMobileMenu()"></div>

<script src="js/data/python.js"></script>
<script src="js/data/numpy.js"></script>
<script src="js/data/pandas.js"></script>
<script src="js/data/pyspark.js"></script>
<script src="js/app.js"></script>
</body>
</html>
