<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GSP Visualizer — Global Supply Planning Data Platform</title>
  <meta name="description" content="Interactive walkthrough of a Global Supply Planning (GSP) data platform: Airflow + Databricks + Delta Lake + Snowflake + o9 Solutions, on Azure or AWS. Architecture, component deep-dives, business cases, failure recovery and interview prep." />
  <meta name="theme-color" content="#14b8a6" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <button id="menu-btn" class="icon-btn menu-btn" title="Menu" aria-label="Toggle navigation">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <a class="brand" href="#home">
      <span class="logo" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 17l5-5 4 3 6-7"/><circle cx="3" cy="17" r="1.4" fill="#fff" stroke="none"/><circle cx="8" cy="12" r="1.4" fill="#fff" stroke="none"/><circle cx="12" cy="15" r="1.4" fill="#fff" stroke="none"/><circle cx="18" cy="8" r="1.4" fill="#fff" stroke="none"/>
        </svg>
      </span>
      <span class="brand-name">GSP <span class="accent">Visualizer</span></span>
      <span class="pill">Supply Planning</span>
    </a>

    <div class="topbar-spacer"></div>

    <div class="cloud-toggle" role="group" aria-label="Cloud">
      <button class="azure" data-cloud="azure" aria-pressed="true"><span class="dot"></span>Azure</button>
      <button class="aws" data-cloud="aws" aria-pressed="false"><span class="dot"></span>AWS</button>
    </div>

    <div class="topbar-actions">
      <button id="theme-toggle" class="icon-btn" title="Toggle theme" aria-label="Toggle light/dark theme">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <a class="home-link" href="../index.html" title="Back to all labs">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span>All labs</span>
      </a>
    </div>
  </header>

  <div class="app-body">
    <aside id="sidebar" class="sidebar" aria-label="Sections"></aside>
    <div id="scrim" class="scrim"></div>
    <main id="main" class="main" aria-live="polite"></main>
  </div>

  <script src="js/data/model.js"></script>
  <script src="js/app.js"></script>
  <script src="../shared/backup-button.js" data-home="off" data-label="Backup" defer></script>
</body>
</html>
