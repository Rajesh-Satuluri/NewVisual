  <!-- Animated launch splash (paints before modules load; removed on app ready) -->
  <style>
    #splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:26px;
      background:radial-gradient(circle at 50% 42%, #141B2E 0%, #0A0E1A 70%);
      transition:opacity .5s ease, visibility .5s ease;}
    #splash.hide{opacity:0;visibility:hidden;}
    #splash .sp-ic{width:132px;height:132px;transform-origin:center;opacity:0;
      filter:drop-shadow(0 12px 32px rgba(0,0,0,.45));
      animation:sp-pop .6s cubic-bezier(.2,1.4,.4,1) .05s forwards, sp-breathe 2.6s ease-in-out 1.1s infinite;}
    #splash .sp-ic svg{width:100%;height:100%;display:block;overflow:visible;}
    #splash .sp-word{font-family:Arial,Helvetica,sans-serif;font-weight:800;font-size:30px;
      letter-spacing:-1px;color:#fff;opacity:0;transform:translateY(10px);
      animation:sp-word .5s ease .55s forwards;}
    @keyframes sp-pop{0%{opacity:0;transform:scale(.4) rotate(-8deg);}60%{opacity:1;}100%{opacity:1;transform:scale(1) rotate(0);}}
    @keyframes sp-breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
    @keyframes sp-word{to{opacity:1;transform:translateY(0);}}
    @media (prefers-reduced-motion:reduce){
      #splash *{animation:none!important;opacity:1!important;transform:none!important;}
    }
  </style>

  <script>
    /* HiDPI canvas rendering — upscale every 2D canvas backing store to the device
       pixel ratio so visuals stay crisp on Retina screens. Draw code uses logical coords. */
    (function () {
      try {
        var dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 3));
        if (dpr === 1 || !window.HTMLCanvasElement) return;
        var proto = HTMLCanvasElement.prototype;
        var wDesc = Object.getOwnPropertyDescriptor(proto, 'width');
        var hDesc = Object.getOwnPropertyDescriptor(proto, 'height');
        if (!wDesc || !hDesc || !wDesc.set || !hDesc.set) return;
        var origGetContext = proto.getContext;
        proto.getContext = function (type) {
          var ctx = origGetContext.apply(this, arguments);
          if ((type === '2d' || type === '2D') && ctx && !this.__hidpi) {
            this.__hidpi = true;
            var el = this, logicalW = wDesc.get.call(el), logicalH = hDesc.get.call(el);
            if (!el.style.width)  el.style.width  = logicalW + 'px';
            if (!el.style.height) el.style.height = logicalH + 'px';
            function applyBacking(){ wDesc.set.call(el, Math.round(logicalW*dpr)); hDesc.set.call(el, Math.round(logicalH*dpr)); ctx.setTransform(dpr,0,0,dpr,0,0); }
            Object.defineProperty(el,'width',{configurable:true,get:function(){return logicalW;},set:function(v){logicalW=v;applyBacking();}});
            Object.defineProperty(el,'height',{configurable:true,get:function(){return logicalH;},set:function(v){logicalH=v;applyBacking();}});
            applyBacking();
          }
          return ctx;
        };
      } catch (e) {}
    })();
  </script>

  <script>
    (function(){
      var s=document.getElementById('splash'); if(!s) return;
      var start=Date.now();
      function done(){
        var wait=Math.max(0, 1000-(Date.now()-start));
        setTimeout(function(){
          s.classList.add('hide');
          setTimeout(function(){ if(s&&s.parentNode) s.parentNode.removeChild(s); }, 600);
        }, wait);
      }
      if(document.readyState==='complete') done();
      else window.addEventListener('load', done);
      setTimeout(done, 4000); // hard fallback
    })();
  </script>
