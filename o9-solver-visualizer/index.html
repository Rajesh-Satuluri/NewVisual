<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>o9 SCS Mastery</title>
  <meta name="description" content="The end-to-end o9 Supply Chain Solver (SCS) study tool — the solver engine, inputs, constraints, decisions, outputs, RCA, supported models, optimization, and interview prep. Built from the o9 Platform Wiki." />

  <!-- No-flash theme: apply stored preference before first paint -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("o9viz-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>

  <meta name="theme-color" content="#0f1226" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f8faff" media="(prefers-color-scheme: light)" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="favicon.svg" />

  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/platform.css" />
</head>
<body>
  <div id="app">

    <header id="topbar" class="topbar">
      <div class="topbar-brand">
        <button id="sidebar-toggle" class="icon-btn sidebar-toggle" title="Menu" aria-label="Toggle navigation">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <span class="brand-icon" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="16" cy="16" r="14" fill="var(--airflow)" opacity="0.15"/>
            <path d="M6 22 L13 22 L16 10 L19 22 L26 22" stroke="var(--airflow)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <circle cx="6" cy="22" r="2" fill="var(--lc)"/>
            <circle cx="16" cy="10" r="2" fill="var(--cyan)"/>
            <circle cx="26" cy="22" r="2" fill="var(--supplier)"/>
          </svg>
        </span>
        <span class="brand-name">o9 SCS <span class="brand-accent">Mastery</span></span>
        <span class="brand-version badge">SCS</span>
      </div>

      <nav class="topbar-nav" aria-label="Primary">
        <a href="#home" class="nav-pill" data-route="home">Home</a>
        <a href="#business-scenario" class="nav-pill" data-route="business-scenario">📦 Business Scenario</a>
        <a href="#worked-example" class="nav-pill" data-route="worked-example">Worked Example</a>
        <a href="#sim-lab" class="nav-pill" data-route="sim-lab">Scenario Lab</a>
      </nav>

      <div class="topbar-actions">
        <button id="palette-open" class="palette-btn" title="Search (⌘K)" aria-label="Search modules">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <span class="pb-text">Search</span>
          <kbd>⌘K</kbd>
        </button>
        <button id="theme-toggle" class="icon-btn" title="Toggle theme (T)" aria-label="Toggle theme">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <button id="kbd-help-btn" class="icon-btn" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="6" width="20" height="12" rx="2"/>
            <path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="app-body">
      <!-- Sidebar is built dynamically from the TRACKS registry in app.js -->
      <aside id="sidebar" class="sidebar" aria-label="Module navigation"></aside>

      <main id="canvas" class="canvas" role="main" aria-live="polite">
        <div id="module-container" class="module-container"></div>
      </main>

      <aside id="detail-panel" class="detail-panel hidden" aria-label="Detail panel">
        <div id="detail-panel-content"></div>
      </aside>
    </div>

    <div id="tooltip" class="tooltip hidden" role="tooltip"></div>

    <div id="kbd-modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Keyboard shortcuts">
      <div class="modal-backdrop"></div>
      <div class="modal-box">
        <div class="modal-header">
          <h2 class="modal-title">Keyboard Shortcuts</h2>
          <button class="modal-close icon-btn" aria-label="Close">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <div class="modal-body" id="kbd-list"></div>
      </div>
    </div>
  </div>

  <!-- Core engine -->
  <script src="js/core/animation-engine.js"></script>
  <script src="js/core/router.js"></script>
  <script src="js/core/tooltip.js"></script>
  <script src="js/core/keyboard.js"></script>

  <!-- Shared components -->
  <script src="js/components/animation-controls.js"></script>
  <script src="js/components/code-viewer.js"></script>
  <script src="js/components/arch-diagram.js"></script>
  <script src="js/components/state-machine.js"></script>
  <script src="js/components/timeline.js"></script>
  <script src="js/components/concept-factory.js"></script>
  <script src="js/components/business-lens.js"></script>

  <!-- Platform features (decoupled; subscribe to app:navigate) -->
  <script src="js/features/progress.js"></script>
  <script src="js/features/command-palette.js"></script>

  <!-- Data -->
  <script src="js/data/catmpn-data.js"></script>
  <script src="js/data/solver-concepts.js"></script>
  <script src="js/data/interview-bank.js"></script>

  <script src="js/app.js"></script>
  <!-- Offline backup: one-click .zip download of this project (top-right) -->
  <script src="../shared/backup-button.js" defer></script>
</body>
</html>
