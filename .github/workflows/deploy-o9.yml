name: Deploy o9 Solver Visualizer (branch preview)

# Additive workflow: publishes the whole repo (landing page + all
# visualizers, including o9-solver-visualizer/) to GitHub Pages from
# the supply-chain build branch, without touching deploy.yml.
on:
  push:
    branches:
      - claude/supply-chain-visualizer-build-277wdo
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
