name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read   # read this run's artifacts API in the wait-for-artifact step

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (build type: GitHub Actions) if not already on
          enablement: true

      - name: Prepare site
        # Housekeeping only — must never fail the deploy for the whole site.
        continue-on-error: true
        run: |
          set -uo pipefail
          echo "== Tools published (folders with index.html) =="
          count=0
          for dir in */ ; do
            name="${dir%/}"
            [ "$name" = "shared" ] && continue
            if [ -f "${name}/index.html" ]; then
              echo "  - ${name}"
              count=$((count+1))
            fi
          done
          echo "== Total tools: ${count} =="
          # Keep large source-only files out of the PUBLISHED site (they stay
          # in git — this only trims the ephemeral CI checkout before upload).
          find . -maxdepth 1 -type f \( -name '*.pdf' -o -name '*.ipynb' \) -print -delete || true
          # Not part of the site — never publish the migration kit if present.
          rm -rf migration || true
          # PWA splash screens (iOS launch images) are large PNGs — ~840 MB
          # across all tools — and the backup-zip steps below copy them twice
          # more (per-tool zip + whole-repo zip), pushing the published artifact
          # past GitHub Pages' ~1 GB limit (deploys have failed since the site
          # crossed it). They are a cosmetic-only iOS feature. Drop them from the
          # PUBLISHED site here (they stay in git); doing it before the zips are
          # built also keeps them out of every backup zip. The apple-touch-
          # startup-image <link>s in each index.html simply 404 (harmless).
          echo "== Trimming splash/ before upload: $(du -ch */splash 2>/dev/null | tail -1 | cut -f1) =="
          find . -type d -name splash -not -path './.git/*' -prune -exec rm -rf {} + || true
          # Ensure Pages serves underscore paths (e.g. _next/) verbatim.
          touch .nojekyll

      - name: Cache-bust local assets
        # Stamp the commit SHA onto every LOCAL .css/.js reference in each
        # index.html so a deploy can never leave a browser on a stale, mixed
        # bundle (the cause of a module rendering its "coming soon" fallback,
        # or a newly shipped feature button never appearing).
        #
        # Matches both layouts: assets under css/ or js/ subfolders AND assets
        # kept flat at the tool root (e.g. script.js, styles.css — the
        # databricks tool does this, so its entry script was never busted and
        # repeat visitors kept running a stale cached script.js).
        #
        # The pattern deliberately skips absolute paths (leading /), external
        # URLs (contain :, e.g. https://) and protocol-relative URLs (leading
        # //), and anything already carrying a query (?), so CDN and already-
        # stamped refs are left alone. Relative paths like ../shared/x.js match.
        # Edits the ephemeral CI checkout only — nothing is committed to git.
        continue-on-error: true
        run: |
          set -uo pipefail
          SHA="${GITHUB_SHA::8}"
          find . -name index.html -not -path './.git/*' | while read -r f; do
            sed -i -E "s#(href|src)=\"([^/\"][^\"?:]*\.(css|js))\"#\1=\"\2?v=${SHA}\"#g" "$f"
          done
          echo "Cache-busted assets with v=${SHA}"

      - name: Build per-project backup zips
        # A zip failure for one tool must never take down the whole deploy.
        continue-on-error: true
        run: |
          set -uo pipefail
          # Build a fresh .zip snapshot of every top-level app (any folder
          # containing an index.html) into that folder, so each project ships
          # a one-click "download this tool" offline backup. Built here in CI
          # only — never committed to git (.gitignore ignores *.zip).
          for dir in */ ; do
            name="${dir%/}"
            [ -f "${name}/index.html" ] || continue
            ( cd "${name}" && zip -rqX "${RUNNER_TEMP}/${name}.zip" . -x '*.zip' ) \
              && cp "${RUNNER_TEMP}/${name}.zip" "${name}/${name}.zip" \
              && echo "backup: ${name}/${name}.zip ($(du -h "${name}/${name}.zip" | cut -f1))" \
              || echo "warn: backup zip failed for ${name} (skipped)"
          done
          # Whole-repo snapshot for the landing page "download all" button.
          zip -rqX "${RUNNER_TEMP}/newvisual-all.zip" . \
            -x '.git/*' -x '*/.git/*' -x '*.zip' -x 'node_modules/*' -x '*/node_modules/*' \
            && cp "${RUNNER_TEMP}/newvisual-all.zip" newvisual-all.zip \
            && echo "backup: newvisual-all.zip ($(du -h newvisual-all.zip | cut -f1))" \
            || echo "warn: whole-repo backup zip failed (skipped)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the repo root: the hub landing page at / plus every tool
          # at its own sub-path, e.g. /airflow-visualizer/, /kafka/, /snowflake/.
          # Each tool is a self-contained static folder, so publishing one
          # never alters another.
          path: .

      - name: Wait for artifact to be queryable
        # deploy-pages@v4 fetches artifact metadata immediately after upload and
        # treats "Found 0 artifact(s)" as fatal with no retry. GitHub's artifact
        # service is eventually consistent, so a back-to-back upload->deploy can
        # race and fail even though the artifact uploaded fine — it appears in
        # the REST artifacts API a few seconds later. This was the cause of the
        # "No artifacts named github-pages were found" deploy failures. Poll the
        # artifacts API until the github-pages artifact is visible, then add a
        # small buffer so deploy-pages' own query also succeeds.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          for i in $(seq 1 20); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
                  --jq '[.artifacts[] | select(.name=="github-pages" and .expired==false)] | length' 2>/dev/null || echo 0)
            if [ "${n:-0}" -ge 1 ]; then
              echo "github-pages artifact visible after check #${i}; buffering 8s"
              sleep 8
              exit 0
            fi
            echo "artifact not visible yet (check #${i})…"
            sleep 6
          done
          echo "artifact still not visible after polling; letting deploy-pages try anyway"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
