name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/newvisual-visualizer-independent-b1u945
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (build type: GitHub Actions) if not already on
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Option A — multi-site: publish the repo root so the landing
          # page plus both visualizers are served:
          #   /                                → landing page
          #   /airflow-visualizer/             → Airflow lab (unchanged files)
          #   /data-engineering-cicd-visualizer/ → CI/CD lab
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
