<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141D2E"/><stop offset="1" stop-color="#0A0F1A"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#79A9FF"/><stop offset="1" stop-color="#4F8CFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.6">
      <stop offset="0" stop-color="#4F8CFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4F8CFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed opaque background (maskable: Android mask crops the edges) + glow -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- glyph kept within the center ~80% safe zone -->
  <g fill="none" stroke="url(#arm)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="206,150 122,256 206,362"/>
    <polyline points="306,150 390,256 306,362"/>
  </g>
  <line x1="298" y1="138" x2="214" y2="374" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round"/>
</svg>
