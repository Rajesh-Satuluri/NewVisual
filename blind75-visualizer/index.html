<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NeetCode 150 — Interactive DSA Study Lab</title>
  <meta name="description" content="An interactive study tool for the NeetCode 150 (incl. Blind 75) LeetCode problems: paraphrased statements, worked examples, plain-English logic, RCS + clean Python, complexity, pattern recognition, and progress tracking." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234f8cff'/%3E%3Ctext x='50' y='70' font-size='40' font-family='Arial' font-weight='bold' text-anchor='middle' fill='%23071120'%3E150%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/prism-tomorrow.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/python.css" />
  <link rel="stylesheet" href="css/master.css" />
</head>
<body>
  <!-- ============ TOP BAR ============ -->
  <header class="topbar">
    <button id="menuBtn" class="icon-btn menu-only" aria-label="Toggle sidebar">☰</button>
    <a class="brand" href="#">
      <span class="brand-mark">DE</span>
      <span class="brand-text">Data Engineering <b>Coding Stack</b></span>
    </a>
    <div class="ws-switches">
      <div id="stackSwitch" class="ws-switch" role="tablist" aria-label="Stack">
        <button class="ws-btn active" data-stack="python" role="tab">🐍 Python</button>
        <button class="ws-btn" data-stack="numpy" role="tab">▦ NumPy</button>
        <button class="ws-btn" data-stack="pandas" role="tab">🐼 Pandas</button>
        <button class="ws-btn" data-stack="spark" role="tab">⚡ PySpark</button>
        <button class="ws-btn" data-stack="sql" role="tab">🗄 SQL</button>
      </div>
      <div id="modeSwitch" class="mode-switch" role="tablist" aria-label="Mode">
        <button class="mode-btn" data-mode="learn" role="tab">📘 Learn</button>
        <button class="mode-btn active" data-mode="practice" role="tab">💻 Practice</button>
      </div>
    </div>
    <div class="topbar-right">
      <button id="paletteBtn" class="ghost-btn" title="Jump to anything (Cmd/Ctrl+K)">⌘K Jump to…</button>
      <button id="dashBtn" class="ghost-btn" title="Progress dashboard">📊 Dashboard</button>
      <button id="gridBtn" class="ghost-btn" title="Revision grid">▦ Revision grid</button>
      <button id="exportBtn" class="ghost-btn" title="Download progress as JSON">↓ Export</button>
      <button id="importBtn" class="ghost-btn" title="Import progress JSON">↑ Import</button>
      <input id="importFile" type="file" accept="application/json" hidden />
      <button id="resetBtn" class="ghost-btn danger" title="Reset all progress">⟳ Reset</button>
      <button id="themeBtn" class="ghost-btn">☀ Light</button>
      <a class="ghost-btn" href="../index.html" title="Back to NewVisual labs">⌂ Labs</a>
    </div>
  </header>

  <div class="shell">
    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar">
      <div id="pyProgress" class="py-progress" hidden></div>
      <div id="setToggle" class="set-toggle" role="tablist" aria-label="Study set">
        <button class="set-btn active" data-set="all" role="tab">All 150</button>
        <button class="set-btn" data-set="blind75" role="tab">Blind 75</button>
      </div>
      <div class="progress-box">
        <div class="progress-head">
          <span id="progressText">0 / 150 solved</span>
          <button id="reviewDueBtn" class="review-due-chip" disabled title="No cards due for review">🔁 <span class="rd-count">0</span> due</button>
        </div>
        <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
        <div class="progress-foot muted"><span id="progressSub">0 learning</span> · of <span id="totalCount">150</span> <span id="setLabel">NeetCode 150</span></div>
      </div>

      <div class="search-box">
        <input id="search" type="text" placeholder="Search…  ( / )" autocomplete="off" />
        <button id="filterToggle" class="filter-toggle" title="Show filters" aria-expanded="false" aria-controls="filterPanel">
          <span class="ft-icon">⚙</span><span id="filterDot" class="filter-dot" hidden></span>
        </button>
      </div>

      <div id="filterPanel" class="filters collapsed">
        <select id="filterDifficulty" title="Filter by difficulty">
          <option value="all">All difficulty</option>
          <option value="Easy">Easy</option>
          <option value="Medium">Medium</option>
          <option value="Hard">Hard</option>
        </select>
        <select id="filterStatus" title="Filter by status">
          <option value="all">Any status</option>
          <option value="not-started">Not started</option>
          <option value="learning">Learning</option>
          <option value="solved">Solved</option>
          <option value="review">★ Review queue</option>
          <option value="due">🔁 Due for review</option>
        </select>
        <select id="filterImportance" title="Filter by interview importance">
          <option value="all">Any importance</option>
          <option value="essential">★★★ Essential</option>
          <option value="common">★★ Common</option>
          <option value="occasional">★ Occasional</option>
        </select>
        <button id="clearFilters" class="clear-btn" title="Clear search & filters">✕</button>
      </div>

      <div class="nav-tools">
        <span class="nav-tools-label">Categories</span>
        <button id="toggleAll" class="nav-tool-icon" title="Collapse all categories" aria-label="Collapse all categories">▾</button>
      </div>

      <nav id="nav" class="nav"></nav>
    </aside>

    <!-- ============ MAIN ============ -->
    <main id="main" class="main"></main>
  </div>

  <!-- ============ REVISION GRID MODAL ============ -->
  <div id="gridModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h2>All 75 — Revision Grid</h2>
        <button id="gridClose" class="icon-btn">✕</button>
      </div>
      <div id="gridBody" class="modal-body"></div>
    </div>
  </div>

  <!-- ============ DASHBOARD MODAL ============ -->
  <div id="dashModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h2>📊 Progress Dashboard</h2>
        <button id="dashClose" class="icon-btn">✕</button>
      </div>
      <div id="dashBody" class="modal-body dash-body"></div>
    </div>
  </div>

  <!-- ============ REVIEW SESSION MODAL ============ -->
  <div id="reviewModal" class="modal hidden">
    <div class="modal-card modal-card-sm">
      <div class="modal-head">
        <h2>🔁 Review Session</h2>
        <button id="reviewClose" class="icon-btn">✕</button>
      </div>
      <div id="reviewBody" class="modal-body review-body"></div>
    </div>
  </div>

  <!-- ============ KEYBOARD SHORTCUTS MODAL ============ -->
  <div id="shortcutsModal" class="modal hidden">
    <div class="modal-card modal-card-sm">
      <div class="modal-head">
        <h2>⌨ Keyboard Shortcuts</h2>
        <button id="shortcutsClose" class="icon-btn">✕</button>
      </div>
      <div id="shortcutsBody" class="modal-body"></div>
    </div>
  </div>

  <!-- ============ PYTHON RECOGNITION REVIEW MODAL ============ -->
  <div id="pyReviewModal" class="modal hidden">
    <div class="modal-card modal-card-sm">
      <div class="modal-head">
        <h2>🔁 Recognize — Spaced Practice</h2>
        <button id="pyReviewClose" class="icon-btn">✕</button>
      </div>
      <div id="pyReviewBody" class="modal-body review-body"></div>
    </div>
  </div>
