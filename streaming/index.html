<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Streaming Engineering Master Lab</title>
  <meta name="description" content="Master streaming from first principles to production — Kafka, Flink, AWS, Azure, Databricks. Interactive, scenario-driven, interview-ready." />
  <meta name="theme-color" content="#06B6D4" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="data:," />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Streaming Engineering Master Lab" />
  <meta property="og:description" content="Master streaming from first principles to production." />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- No-flash theme: apply saved theme before first paint -->
  <script>
    try {
      var t = localStorage.getItem('sml-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="brand" role="link" tabindex="0" title="Home" onclick="location.hash='#home'">
          <span class="brand-icon">🌊</span>
          <div>
            <div class="brand-title">Streaming Master Lab</div>
            <div class="brand-sub">First principles → production</div>
          </div>
        </div>
        <button id="sidebar-toggle" class="icon-btn" title="Toggle sidebar" aria-label="Toggle sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="sidebar-progress">
        <div class="progress-label"><span>Progress</span><span id="progress-count">0 / 12</span></div>
        <div class="progress-bar"><div id="progress-fill"></div></div>
      </div>
      <nav id="nav-list" aria-label="Main navigation"></nav>
      <div class="sidebar-footer">
        <span class="build-badge" id="build-badge">template</span>
      </div>
    </aside>

    <main id="content">
      <div id="module-header">
        <button id="nav-open" class="icon-btn" aria-label="Open navigation menu" title="Menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div id="breadcrumb"></div>
        <div class="header-actions">
          <div id="scenario-switcher" class="scenario-switcher" title="Switch business scenario"></div>
          <button id="theme-toggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
            <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
              <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
          </button>
        </div>
      </div>
      <div id="module-canvas"></div>
    </main>
    <div id="nav-scrim"></div>
  </div>
  <script type="module" src="script.js"></script>
</body>
</html>
