<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- Apply saved theme before first paint (prevents theme flash) -->
  <script>
    try {
      var t = localStorage.getItem('sviz-theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>

  <title>SnowflakeViz — Netflix Architecture Handbook</title>
  <meta name="description" content="Interactive Snowflake architecture guide using Netflix as the real-world data platform story." />
  <meta name="theme-color" content="#0d1117" />
  <meta name="color-scheme" content="dark light" />

  <!-- Icons & PWA -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />

  <!-- Social preview -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="SnowflakeViz — Netflix Architecture Handbook" />
  <meta property="og:description" content="An interactive, step-by-step guide to Snowflake's architecture, told through Netflix's real-world data platform." />
  <meta property="og:image" content="https://rajesh-satuluri.github.io/NewVisual/snowflake/assets/og-image.png" />
  <meta property="og:url" content="https://rajesh-satuluri.github.io/NewVisual/snowflake/" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="SnowflakeViz — Netflix Architecture Handbook" />
  <meta name="twitter:description" content="An interactive, step-by-step guide to Snowflake's architecture, told through Netflix's real-world data platform." />
  <meta name="twitter:image" content="https://rajesh-satuluri.github.io/NewVisual/snowflake/assets/og-image.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/modules.css" />

  <style>
    /* ── Home page layout ───────────────────────────────── */
    .home-hero {
      max-width: 780px;
      margin: 0 auto;
      padding: 3.5rem 1.5rem 2.5rem;
      text-align: center;
    }
    .home-hero-badge {
      display: inline-block;
      background: rgba(41,181,232,.12);
      border: 1px solid rgba(41,181,232,.3);
      color: var(--snowflake);
      border-radius: 100px;
      padding: .25rem 1rem;
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .05em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }
    .home-hero-title {
      font-size: clamp(1.75rem, 4vw, 3rem);
      font-weight: 700;
      line-height: 1.2;
      margin: 0 0 1rem;
      color: var(--text-primary);
    }
    .home-hero-sub {
      font-size: 1.0625rem;
      color: var(--text-secondary);
      line-height: 1.7;
      margin: 0 auto 2rem;
      max-width: 580px;
    }
    .home-hero-cta { display: flex; gap: .75rem; justify-content: center; flex-wrap: wrap; }

    /* Stats strip */
    .home-stats-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin: 0 0 3rem;
    }
    .home-stat-card {
      flex: 1 1 160px;
      padding: 1.25rem 1rem;
      text-align: center;
      background: var(--surface);
    }
    .home-stat-value {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--snowflake);
      font-variant-numeric: tabular-nums;
    }
    .home-stat-label {
      font-size: .75rem;
      font-weight: 600;
      color: var(--text-primary);
      margin: .25rem 0 .125rem;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .home-stat-sub { font-size: .7rem; color: var(--text-muted); }

    /* Architecture preview */
    .home-arch-preview { margin-bottom: 3rem; }
    .home-layer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1rem;
      margin-top: 1.5rem;
    }
    .home-layer-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      transition: border-color .2s, transform .2s;
    }
    .home-layer-card:hover { transform: translateY(-2px); }
    .home-layer-icon { font-size: 2rem; margin-bottom: .75rem; }
    .home-layer-name { font-weight: 600; font-size: .9375rem; margin-bottom: .5rem; }
    .home-layer-desc { font-size: .84rem; color: var(--text-secondary); line-height: 1.6; margin: 0 0 .875rem; }
    .home-layer-tags { display: flex; flex-wrap: wrap; gap: .375rem; }

    /* Warehouses */
    .home-wh-section { margin-bottom: 3rem; }
    .home-wh-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
      margin-top: 1.5rem;
    }
    .home-wh-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid;
      border-radius: var(--radius-lg);
      padding: 1.125rem 1.25rem;
    }
    .home-wh-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: .5rem; }
    .home-wh-name { font-family: var(--font-mono); font-size: .8125rem; font-weight: 600; }
    .home-wh-purpose { font-size: .8125rem; color: var(--text-secondary); margin: 0 0 .625rem; line-height: 1.5; }
    .home-wh-meta { display: flex; gap: .75rem; flex-wrap: wrap; font-size: .7rem; color: var(--text-muted); }
    .home-wh-team { color: var(--text-secondary); }

    /* Module cards */
    .home-modules-section { margin-bottom: 3rem; }
    .home-module-group { margin-top: 2rem; }
    .home-module-group-title {
      font-size: .6875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--text-muted);
      margin-bottom: .75rem;
      padding-bottom: .375rem;
      border-bottom: 1px solid var(--border);
    }
    .home-module-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: .625rem;
    }
    .home-module-card {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: .875rem 1rem;
      cursor: pointer;
      transition: background .15s, border-color .15s, transform .15s;
    }
    .home-module-card:hover, .home-module-card:focus {
      background: var(--bg-3);
      border-color: var(--snowflake);
      transform: translateX(2px);
      outline: none;
    }
    .home-module-icon { font-size: 1.375rem; flex-shrink: 0; width: 2rem; text-align: center; }
    .home-module-info { flex: 1; min-width: 0; }
    .home-module-label { font-weight: 600; font-size: .875rem; color: var(--text-primary); margin-bottom: .2rem; }
    .home-module-desc { font-size: .75rem; color: var(--text-muted); line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .home-module-arrow { color: var(--text-muted); font-size: 1.125rem; flex-shrink: 0; transition: color .15s; }
    .home-module-card:hover .home-module-arrow { color: var(--snowflake); }

    /* Placeholder for unbuilt modules */
    .placeholder-msg {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 40vh;
      gap: 1rem;
      text-align: center;
      padding: 3rem;
    }
    .placeholder-icon { font-size: 3.5rem; }
    .placeholder-msg h2 { margin: 0; font-size: 1.5rem; }

    /* Breadcrumb */
    #breadcrumb { display: flex; align-items: center; gap: .375rem; font-size: .8125rem; color: var(--text-muted); }
    #breadcrumb span:last-child { color: var(--text-secondary); }
    .bc-sep { color: var(--border); }

    /* Shortcuts modal */
    .shortcuts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.5rem;
      padding: 1.5rem;
      max-height: 65vh;
      overflow-y: auto;
    }
    .shortcut-group-title {
      font-size: .6875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--text-muted);
      margin-bottom: .625rem;
    }
    .shortcut-row { display: flex; align-items: center; gap: .625rem; padding: .25rem 0; }
    .shortcut-row kbd {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: .125rem .4rem;
      font-family: var(--font-mono);
      font-size: .6875rem;
      color: var(--text-secondary);
      white-space: nowrap;
    }
    .shortcut-row span { font-size: .8125rem; color: var(--text-secondary); }

    /* ── Shortcuts modal visibility ─────────────────────── */
    #shortcuts-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: var(--z-modal, 300);
      background: rgba(0,0,0,.75);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    #shortcuts-modal.visible { display: flex; }

    /* ── Canvas scrolling ───────────────────────────────── */
    #canvas {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      min-height: 0;
    }

    /* ── Section typography (used by home.js) ───────────── */
    .section-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: .375rem;
      letter-spacing: -.01em;
    }
    .section-sub {
      font-size: .875rem;
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
      line-height: 1.65;
    }

    /* ── Sidebar footer flex ────────────────────────────── */
    #sidebar-footer {
      display: flex;
      align-items: center;
      gap: .25rem;
    }
    #sidebar-version {
      font-size: .6875rem;
      color: var(--text-muted);
      margin-left: auto;
    }
  </style>

  <!-- Responsive & touch layer — must load last to win the cascade -->
  <link rel="stylesheet" href="css/responsive.css" />
  <!-- Enhancements: command palette, pager, progress, tour, toast -->
  <link rel="stylesheet" href="css/enhancements.css" />
</head>

<body>
  <!-- ── App Shell ──────────────────────────────────────── -->
  <div id="app">

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div id="sidebar-header" class="sidebar-header">
        <!-- Snowflake Crystal Logo -->
        <a href="#home" id="logo-link" style="text-decoration:none;display:flex;align-items:center;gap:.625rem;">
          <svg id="crystal-logo" viewBox="0 0 40 40" width="32" height="32" aria-hidden="true">
            <!-- Vertical bar -->
            <rect x="18.5" y="4" width="3" height="32" rx="1.5" fill="#29b5e8"/>
            <!-- Horizontal bar -->
            <rect x="4" y="18.5" width="32" height="3" rx="1.5" fill="#29b5e8"/>
            <!-- Diagonal bars -->
            <rect x="8" y="8" width="3" height="24" rx="1.5" fill="rgba(41,181,232,.55)"
              transform="rotate(45 9.5 20)"/>
            <rect x="8" y="8" width="3" height="24" rx="1.5" fill="rgba(41,181,232,.55)"
              transform="rotate(-45 30.5 20)"/>
            <!-- End dots -->
            <circle cx="20" cy="4"  r="2.25" fill="#29b5e8"/>
            <circle cx="20" cy="36" r="2.25" fill="#29b5e8"/>
            <circle cx="4"  cy="20" r="2.25" fill="#29b5e8"/>
            <circle cx="36" cy="20" r="2.25" fill="#29b5e8"/>
            <!-- Center -->
            <circle cx="20" cy="20" r="3.5" fill="#29b5e8"/>
          </svg>
          <div>
            <div id="logo-title">SnowflakeViz</div>
            <div id="logo-sub">Netflix Handbook</div>
          </div>
        </a>
      </div>

      <div id="sidebar-search-wrap" class="sidebar-search">
        <div class="search-input-wrap">
          <svg class="search-icon" viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <circle cx="6.5" cy="6.5" r="4.5"/><line x1="10" y1="10" x2="14" y2="14"/>
          </svg>
          <input id="sidebar-search" type="search" placeholder="Search modules…" autocomplete="off" spellcheck="false" />
        </div>
      </div>

      <nav id="sidebar-nav" class="sidebar-nav-scroll" aria-label="Module navigation"></nav>

      <div id="sidebar-footer" class="sidebar-footer">
        <button id="theme-toggle" class="btn-icon" title="Toggle theme" aria-label="Toggle light/dark theme">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>
        <button class="btn-icon" title="Keyboard shortcuts (?)" onclick="window.SnowflakeViz?._showShortcutsModal?.()">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="6" width="20" height="13" rx="2"/>
            <path d="M6 10h0M10 10h0M14 10h0M18 10h0M6 14h12"/>
          </svg>
        </button>
        <span id="sidebar-version">v3.5</span>
      </div>
    </aside>

    <!-- Main area -->
    <main id="main-area" class="main">
      <header id="top-bar" class="topbar">
        <button id="nav-toggle" class="btn-icon nav-toggle" aria-label="Open navigation menu" aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <div id="breadcrumb">
          <span>SnowflakeViz</span>
        </div>
        <div id="top-bar-right" class="topbar-right">
          <a href="https://docs.snowflake.com" target="_blank" rel="noopener" class="btn-icon" title="Snowflake Docs" aria-label="Snowflake documentation">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/>
              <polyline points="15 3 21 3 21 9"/>
              <line x1="10" y1="14" x2="21" y2="3"/>
            </svg>
          </a>
        </div>
      </header>

      <!-- Module canvas -->
      <div id="canvas" role="main" aria-live="polite"></div>

      <!-- Animation controls bar -->
      <div id="anim-controls-bar" class="anim-controls-bar" role="toolbar" aria-label="Animation controls">
        <button id="anim-btn-reset"  class="btn-icon anim-btn" title="Reset (R)" aria-label="Reset animation">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="1 4 1 10 7 10"/>
            <path d="M3.51 15a9 9 0 1 0 .49-5"/>
          </svg>
        </button>
        <button id="anim-btn-prev"   class="btn-icon anim-btn" title="Previous (←)" aria-label="Previous step">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
            <polygon points="19,3 5,12 19,21"/>
          </svg>
        </button>
        <button id="anim-btn-play"   class="btn-icon anim-btn anim-btn-play" title="Play (Space)" aria-label="Play/pause">
          <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><polygon points="5,3 19,12 5,21"/></svg>
        </button>
        <button id="anim-btn-next"   class="btn-icon anim-btn" title="Next (→)" aria-label="Next step">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
            <polygon points="5,3 19,12 5,21"/>
          </svg>
        </button>
        <div id="anim-progress-wrap" class="anim-controls-center">
          <div id="anim-progress-track" class="anim-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100">
            <div id="anim-progress-fill" class="anim-progress-fill"></div>
          </div>
          <div id="anim-step-label" class="anim-step-label"></div>
        </div>
        <div id="anim-step-counter" class="anim-step-counter"></div>
        <select id="anim-speed" class="anim-speed-select" title="Playback speed" aria-label="Playback speed">
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="1.5">1.5×</option>
          <option value="2">2×</option>
        </select>
      </div>
    </main>

    <!-- Off-canvas nav backdrop (mobile/tablet) -->
    <div id="nav-backdrop" class="nav-backdrop"></div>
  </div>

  <!-- Keyboard shortcuts modal -->
  <div id="shortcuts-modal" role="dialog" aria-modal="true" aria-label="Keyboard shortcuts">
    <div class="modal-box" style="max-height:80vh;overflow:hidden;display:flex;flex-direction:column;">
      <div class="modal-header">
        <h2 class="modal-title" style="font-size:1.125rem;font-weight:600;">Keyboard Shortcuts</h2>
        <button id="shortcuts-close" class="btn-icon" aria-label="Close">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="shortcuts-grid" style="overflow-y:auto;"></div>
    </div>
  </div>
