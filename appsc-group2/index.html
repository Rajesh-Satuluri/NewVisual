<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <script>try{var t=localStorage.getItem('appscg2-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <title>APPSC Group 2 — Syllabus Map</title>
  <meta name="description" content="A syllabus-first study map for APPSC Group 2. See the full Prelims + Mains syllabus as a weighted tree, the exam blueprint, and the notification history. Previous-year question coverage arrives in Phase 1." />
  <meta name="theme-color" content="#0b0f1a" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 32 32" fill="none">
            <circle cx="16" cy="16" r="14" fill="var(--accent)" opacity="0.14"/>
            <path d="M7 16 Q11.5 7 16 16 Q20.5 25 25 16" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
            <circle cx="7" cy="16" r="2" fill="var(--accent)"/>
            <circle cx="16" cy="16" r="2" fill="var(--accent2)"/>
            <circle cx="25" cy="16" r="2" fill="var(--accent)"/>
          </svg>
        </span>
        <span class="brand-name">APPSC <span class="brand-accent">Group 2</span></span>
        <span class="badge" id="phase-badge">PYQ · 4 papers analysed</span>
      </div>
      <nav class="nav" aria-label="Views">
        <button class="nav-pill active" data-view="board">📊 Priority Board</button>
        <button class="nav-pill" data-view="map">🗺️ Syllabus Map</button>
        <button class="nav-pill" data-view="tracker">✅ Prep Tracker</button>
        <button class="nav-pill" data-view="pyq">📊 PYQ Analysis</button>
        <button class="nav-pill" data-view="blueprint">📋 Blueprint</button>
        <button class="nav-pill" data-view="practice" hidden>🎯 Practice</button>
      </nav>
      <div class="actions topbar-actions">
        <a class="icon-btn" href="../index.html" title="All labs" aria-label="All labs">◤</a>
        <button id="theme-toggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">☾</button>
      </div>
    </header>

    <main id="main"><!-- rendered by app.js --></main>

    <footer class="foot">
      Syllabus compiled from APPSC public sources · to be reconciled with the official 2026 notification ·
      <a class="plain" href="../index.html">back to all labs</a>
    </footer>
  </div>

  <!-- Drill-down drawer -->
  <div id="drawer" class="drawer" hidden>
    <div class="drawer-scrim" data-close></div>
    <aside class="drawer-panel" role="dialog" aria-modal="true">
      <button class="drawer-close" data-close aria-label="Close">✕</button>
      <div id="drawer-body"></div>
    </aside>
  </div>

  <script src="data/syllabus.js"></script>
  <script src="data/pyq.js"></script>
  <script src="data/pyq_bank.js"></script>
  <script src="js/app.js"></script>
  <!-- Offline backup: one-click .zip download of this project (top-right) -->
  <script src="../shared/backup-button.js" data-home="off" defer></script>
</body>
</html>
