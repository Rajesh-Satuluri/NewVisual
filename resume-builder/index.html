<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume Builder — NewVisual</title>
  <meta name="description" content="Keep a master library of your resume content and compose multiple role-tailored resumes from it — same template, live preview, one-page PDF. Static site, your data stays in your browser." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..800;1,14..32,400..600&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..600&display=swap" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Top bar -->
  <header class="topbar no-print">
    <div class="topbar-left">
      <a class="home-link" href="../index.html" title="Back to NewVisual">←</a>
      <span class="brand">Resume Builder</span>
      <nav class="tabs" id="tabs" role="tablist" aria-label="Sections">
        <button class="tab" data-tab="resumes" role="tab" title="Build your resume">Resumes</button>
        <button class="tab grp-start" data-tab="jd" role="tab" title="Tailor to a job description">JD Match</button>
        <button class="tab" data-tab="health" role="tab" title="Check resume quality">Health</button>
        <button class="tab" data-tab="cover" role="tab" title="Draft a cover letter">Cover Letter</button>
        <button class="tab grp-start" data-tab="tracker" role="tab" title="Track applications">Tracker</button>
        <button class="tab grp-start" data-tab="library" role="tab" title="Reusable content library">Library</button>
        <button class="tab" data-tab="ai" role="tab" title="AI prompt helper">AI Assist</button>
        <button class="tab" data-tab="ats" role="tab" title="ATS guidance">ATS Guide</button>
      </nav>
      <span class="save-state" id="saveState" aria-live="polite">Saved</span>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-icon" id="btnUndo" title="Undo (Ctrl+Z)" aria-label="Undo" disabled></button>
      <button class="btn btn-icon" id="btnRedo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo" disabled></button>
      <div class="menu-wrap" id="downloadWrap">
        <button class="btn btn-primary btn-menu" id="btnDownload" aria-haspopup="menu" aria-expanded="false" title="Download this resume">
          <span class="btn-menu-label">Download</span>
        </button>
        <div class="menu" id="downloadMenu" role="menu" aria-label="Download" hidden>
          <button class="menu-item" role="menuitem" id="miPdf"><span class="mi-title">PDF</span><span class="mi-sub">Print-quality, ATS-safe</span></button>
          <button class="menu-item" role="menuitem" id="miDocx"><span class="mi-title">Word (.docx)</span><span class="mi-sub">Editable document</span></button>
          <div class="menu-sep"></div>
          <button class="menu-item" role="menuitem" id="miJson"><span class="mi-title">Data backup (.json)</span><span class="mi-sub">All resumes &amp; library</span></button>
        </div>
      </div>
      <div class="menu-wrap" id="moreWrap">
        <button class="btn btn-icon" id="btnMore" aria-haspopup="menu" aria-expanded="false" aria-label="More actions" title="More actions"></button>
        <div class="menu menu-right" id="moreMenu" role="menu" aria-label="More actions" hidden>
          <button class="menu-item" role="menuitem" id="miImport"><span class="mi-title">Import data…</span><span class="mi-sub">Restore from a .json backup</span></button>
          <button class="menu-item" role="menuitem" id="miPrint"><span class="mi-title">Print…</span><span class="mi-sub">Use the browser print dialog</span></button>
          <div class="menu-sep"></div>
          <button class="menu-item menu-danger" role="menuitem" id="miReset"><span class="mi-title">Reset to sample…</span><span class="mi-sub">Replace everything with the demo</span></button>
        </div>
      </div>
      <input type="file" id="fileImport" accept="application/json" hidden />
    </div>
  </header>

  <main class="layout">
    <!-- LEFT PANEL (tab content) -->
    <section class="editor no-print" id="editor" aria-label="Editor">
      <div id="tabPanel"><!-- built by JS --></div>
    </section>

    <!-- DRAG HANDLE: resize editor / preview -->
    <div class="resizer no-print" id="resizer" role="separator" aria-orientation="vertical" aria-label="Resize panels" title="Drag to resize"></div>

    <!-- PREVIEW PANEL -->
    <section class="preview-wrap" aria-label="Resume preview">
      <div class="preview-head no-print">
        <span class="preview-label" id="previewLabel">Preview · A4</span>
        <span class="page-badge ok" id="pageBadge">1 page</span>
      </div>
      <div class="page-holder" id="pageHolder">
        <div class="page-scaler" id="pageScaler">
          <div class="page" id="page"><!-- built by JS --></div>
        </div>
      </div>
      <div class="ai-pane no-print" id="aiPane"><!-- big editor for AI Assist, built by JS --></div>
    </section>
  </main>

  <script src="js/app.js"></script>
  <!-- Offline backup: one-click .zip download of this project (top-right) -->
  <script src="../shared/backup-button.js" defer></script>
</body>
</html>
