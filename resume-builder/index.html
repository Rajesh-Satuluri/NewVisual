<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume Builder — NewVisual</title>
  <meta name="description" content="Keep a master library of your resume content and compose multiple role-tailored resumes from it — same template, live preview, one-page PDF. Static site, your data stays in your browser." />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Top bar -->
  <header class="topbar no-print">
    <div class="topbar-left">
      <a class="home-link" href="../index.html" title="Back to NewVisual">←</a>
      <span class="brand">Resume Builder</span>
      <nav class="tabs" id="tabs">
        <button class="tab" data-tab="resumes">Resumes</button>
        <button class="tab" data-tab="library">Library</button>
        <button class="tab" data-tab="ats">ATS Guide</button>
      </nav>
      <span class="save-state" id="saveState">Saved</span>
    </div>
    <div class="topbar-actions">
      <button class="btn" id="btnImport" title="Import all data (JSON)">Import</button>
      <button class="btn" id="btnExport" title="Export all data (JSON)">Export</button>
      <button class="btn" id="btnReset" title="Reset to sample data">Reset</button>
      <button class="btn btn-primary" id="btnPdf" title="Download the active resume as PDF">⬇ Download PDF</button>
      <input type="file" id="fileImport" accept="application/json" hidden />
    </div>
  </header>

  <main class="layout">
    <!-- LEFT PANEL (tab content) -->
    <section class="editor no-print" id="editor" aria-label="Editor">
      <div id="tabPanel"><!-- built by JS --></div>
    </section>

    <!-- PREVIEW PANEL -->
    <section class="preview-wrap" aria-label="Resume preview">
      <div class="preview-head no-print">
        <span class="preview-label" id="previewLabel">Preview · A4</span>
        <span class="page-badge ok" id="pageBadge">1 page</span>
      </div>
      <div class="page-holder" id="pageHolder">
        <div class="page-scaler" id="pageScaler">
          <div class="page" id="page"><!-- built by JS --></div>
        </div>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
